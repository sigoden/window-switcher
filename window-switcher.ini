# Whether to show the notification-area icon.
trayicon = yes

[switch-windows]
# Switch between windows belonging to the foreground app.
hotkey = alt+`
blacklist =
ignore_minimal = no
thumbnail_preview = yes
enable_quick_actions = yes
only_current_desktop = auto

[switch-apps]
# Optional app-level switcher.
enable = no
hotkey = alt+tab
ignore_minimal = no
override_icons =
only_current_desktop = auto

[log]
level = info
path =
